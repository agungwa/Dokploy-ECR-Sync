name: Update ECR Credentials in Dokploy

on:
  # Manual trigger
  workflow_dispatch:
  # Or run on a schedule (ECR tokens last 12 hours)
  # schedule:
  #   - cron: "0 */6 * * *"

jobs:
  sync-ecr:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Configure AWS credentials
      # Option A: Using OIDC (recommended)
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-ecr-role
          aws-region: ap-southeast-1

      # Option B: Using access keys
      # - name: Configure AWS Credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ap-southeast-1

      # Step 2: Sync ECR credentials to Dokploy and redeploy
      - name: Sync ECR Credentials to Dokploy
        uses: ./
        with:
          dokploy-url: ${{ secrets.DOKPLOY_URL }}
          dokploy-api-key: ${{ secrets.DOKPLOY_API_KEY }}
          aws-region: ap-southeast-1
          registry-name: "AWS ECR"
          # Leave empty to auto-discover apps, or specify IDs:
          # application-ids: "abc123,def456"
          redeploy: true
          test-connection: false
